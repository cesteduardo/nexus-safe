<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ficha admissional · Nexus Safe</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="../assets/marca.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="crm.css">
<style>
  body { background: var(--fundo); }
  .ficha { max-width: 560px; margin: 0 auto; min-height: 100vh; background: var(--branco); display: flex; flex-direction: column; }
  @media (min-width: 600px) { .ficha { margin: 24px auto; min-height: 0; border-radius: 20px; box-shadow: var(--sombra); overflow: hidden; } }
  .ficha__topo { position: sticky; top: 0; z-index: 5; background: var(--branco); padding: 14px 18px 12px; border-bottom: 1px solid var(--linha); }
  .ficha__topo-linha { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--apoio); }
  .ficha__clinica { font-weight: 600; color: var(--tinta); font-size: 14px; }
  .barra { height: 6px; border-radius: 99px; background: var(--fundo); margin-top: 10px; overflow: hidden; }
  .barra span { display: block; height: 100%; background: var(--verde); border-radius: 99px; transition: width 300ms ease; }
  .ficha__corpo { padding: 22px 18px 24px; flex: 1; display: grid; gap: 18px; align-content: start; }
  .ficha__corpo h1 { font-size: 26px; }
  .ficha__corpo > p { color: var(--apoio); font-size: 15.5px; }
  .ficha__pe { position: sticky; bottom: 0; background: var(--branco); padding: 12px 18px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--linha); display: flex; gap: 10px; }
  .ficha__pe .botao { flex: 1; min-height: 50px; font-size: 16px; }
  .ficha__pe .botao--claro { flex: 0 0 auto; }
  .entrada { min-height: 48px; font-size: 16px; }
  .grupo { display: grid; gap: 14px; }
  .duas { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 380px) { .duas { grid-template-columns: 1fr; } }
  .caixa { background: var(--fundo); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
  .caixa h3 { font-size: 16px; font-family: var(--fonte); font-weight: 650; }
  .sn { border: 0; margin: 0; padding: 12px 0; border-bottom: 1px solid var(--linha); display: grid; gap: 10px; }
  .sn:last-child { border-bottom: 0; }
  .sn legend { padding: 0; font-size: 15.5px; color: var(--tinta); font-weight: 500; float: left; width: 100%; margin-bottom: 10px; }
  .sn__ops { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; clear: both; }
  .sn__ops label, .opcoes label { position: relative; display: flex; align-items: center; justify-content: center; min-height: 46px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--linha-forte); font-weight: 500; cursor: pointer; background: var(--branco); transition: box-shadow 140ms ease, background-color 140ms ease; padding: 6px 10px; text-align: center; font-size: 15px; }
  .sn__ops input, .opcoes input { position: absolute; opacity: 0; pointer-events: none; }
  .sn__ops label:has(input:checked) { box-shadow: inset 0 0 0 2px var(--verde); background: var(--verde-claro); color: var(--verde-escuro); }
  .sn__ops label:has(input[value="sim"]:checked) { box-shadow: inset 0 0 0 2px var(--ambar); background: var(--ambar-claro); color: var(--ambar); }
  .sn__ops label:has(input:focus-visible), .opcoes label:has(input:focus-visible) { outline: 2px solid var(--verde); outline-offset: 2px; }
  .opcoes { display: flex; flex-wrap: wrap; gap: 8px; }
  .opcoes label { min-height: 40px; font-size: 14px; }
  [data-radio] label { flex: 1 1 0; min-height: 46px; font-size: 15px; }
  .opcoes label:has(input:checked) { box-shadow: inset 0 0 0 2px var(--verde); background: var(--verde-claro); color: var(--verde-escuro); }
  .erro { color: var(--vermelho); font-size: 14px; font-weight: 500; }
  .faltando { box-shadow: inset 3px 0 0 var(--vermelho); padding-left: 12px !important; }
  .info { font-size: 14px; color: var(--apoio); background: var(--fundo); border-radius: 12px; padding: 14px 16px; line-height: 1.5; }
  .info b { color: var(--tinta); }
  .tela { position: relative; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--linha-forte); background: #fff; touch-action: none; }
  .tela canvas { display: block; width: 100%; height: 180px; border-radius: 12px; cursor: crosshair; }
  .tela span { position: absolute; left: 16px; right: 16px; bottom: 40px; border-top: 1px dashed var(--linha-forte); pointer-events: none; }
  .tela small { position: absolute; left: 16px; bottom: 14px; color: var(--apoio-claro); font-size: 12.5px; pointer-events: none; }
  .check { display: flex; gap: 12px; align-items: flex-start; font-size: 15px; cursor: pointer; }
  .termo { font-size: 14px; color: var(--apoio); margin: -6px 0 0 34px; }
  .termo summary { color: var(--verde); font-weight: 600; cursor: pointer; padding: 6px 0; }
  .termo__texto { display: grid; gap: 8px; padding: 4px 0 6px; }
  .termo__texto p { margin: 0; }
  .check input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--verde); flex: none; }
  .final { text-align: center; padding: 48px 8px; display: grid; gap: 14px; justify-items: center; }
  .final__ico { width: 64px; height: 64px; border-radius: 50%; background: var(--verde-claro); color: var(--verde); display: grid; place-items: center; }
  .final__ico svg { width: 32px; height: 32px; }
  .selo-ns { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12.5px; color: var(--apoio-claro); padding: 4px 0 2px; }
  .selo-ns .ns { width: 15px; height: 15px; }
  .selo-ns b { color: var(--tinta); font-weight: 600; }
  .link-texto { background: none; border: 0; color: var(--verde); font-weight: 600; cursor: pointer; padding: 6px 0; justify-self: start; }
</style>
</head>
<body>
<div class="ficha" data-ficha>
  <p class="ficha__corpo">Carregando a ficha...</p>
</div>
<script src="campos.js"></script>
<script src="modo.js"></script>
<script src="regras.js"></script>
<script src="dados.js"></script>
<script src="ficha.js"></script>
</body>
</html>
