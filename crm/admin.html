<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus Safe: administração</title>
<meta name="description" content="Administração da Nexus Safe: agências clientes, serviços contratados, uso do mês e chamados de TI.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A7A5C">
<link rel="icon" href="../assets/marca.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="crm.css">
</head>
<body>
<div class="demo-faixa">Modelo de demonstração. Dados fictícios, salvos só neste navegador. <a href="../">Voltar ao plano</a></div>

<div class="app">
  <aside class="lateral">
    <a class="marca" href="#/agencias"><svg class="ns" viewBox="15 15 70 70" aria-hidden="true"><path class="ns__a" d="M22 64V34a12 12 0 0 1 12-12h30"/><path class="ns__b" d="M78 36v30a12 12 0 0 1-12 12H36"/><rect class="ns__c" x="42" y="42" width="16" height="16" rx="4"/></svg><span>Nexus <i>Safe</i></span></a>
    <div class="lateral__clinica">Perfil<b>Administração</b></div>
    <nav class="menu" aria-label="Seções">
      <a href="#/agencias" data-rota="agencias"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V8l7-4 7 4v13"/><path d="M9 21v-5h6v5"/></svg>Agências clientes</a>
      <a href="#/chamados" data-rota="chamados"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>Chamados de TI</a>
    </nav>
    <div class="lateral__pe">
      <a href="entrar.html">Trocar de perfil</a>
      <button type="button" data-restaurar>Restaurar a demonstração</button>
    </div>
  </aside>

  <main class="principal" id="vista" tabindex="-1"></main>
</div>

<div class="veu" data-veu hidden></div>
<section class="painel" data-painel aria-label="Agência" hidden></section>

<dialog class="modal" data-modal-chamado>
  <form method="dialog" data-form-chamado novalidate>
    <h2>Novo chamado</h2>
    <label class="campo">Agência<select class="entrada" name="agenciaId" required data-sel-agencia></select></label>
    <label class="campo">O que aconteceu<input class="entrada" name="assunto" required autocomplete="off" placeholder="Ex.: impressora de ASO não imprime"></label>
    <label class="campo">Detalhes<textarea class="entrada" name="descricao" required placeholder="O que já foi tentado, desde quando, em qual máquina"></textarea></label>
    <div class="acoes-linha">
      <label class="campo">Tipo<select class="entrada" name="categoria" required data-sel-categoria></select></label>
      <label class="campo">Prioridade<select class="entrada" name="prioridade" required><option value="urgente">Urgente</option><option value="normal" selected>Normal</option><option value="baixa">Baixa</option></select></label>
      <label class="campo">Chegou por<select class="entrada" name="canal" required><option>WhatsApp</option><option>Telefone</option><option>Portal</option></select></label>
    </div>
    <div class="modal__acoes">
      <button class="botao botao--claro" value="cancelar" formnovalidate>Cancelar</button>
      <button class="botao" value="salvar">Abrir chamado</button>
    </div>
  </form>
</dialog>

<div class="toast" data-toast role="status" aria-live="polite"></div>

<script src="campos.js"></script>
<script src="dados.js"></script>
<script src="contas.js"></script>
<script src="movimento.js"></script>
<script src="admin.js"></script>
</body>
</html>
