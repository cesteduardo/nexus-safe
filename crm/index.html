<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus Safe: modelo do CRM</title>
<meta name="description" content="Modelo funcional do CRM da Nexus Safe: quadro de candidatos, ficha admissional, tela do médico, ASO e automações.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A7A5C">
<link rel="icon" href="../assets/marca.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="crm.css">
<script>try{var p=JSON.parse(localStorage.getItem('nexus-safe-perfil'));if(!p||!p.usuario||p.tipo!=='clinica')location.replace('entrar.html')}catch(e){location.replace('entrar.html')}</script>
</head>
<body>
<div class="demo-faixa">Modelo de demonstração. Dados fictícios, salvos só neste navegador. <a href="../">Voltar ao plano</a></div>

<div class="app">
  <aside class="lateral">
    <a class="marca" href="#/quadro"><svg class="ns" viewBox="15 15 70 70" aria-hidden="true"><path class="ns__a" d="M22 64V34a12 12 0 0 1 12-12h30"/><path class="ns__b" d="M78 36v30a12 12 0 0 1-12 12H36"/><rect class="ns__c" x="42" y="42" width="16" height="16" rx="4"/></svg><span>Nexus <i>Safe</i></span></a>
    <div class="lateral__clinica">Agência<b data-clinica></b></div>
    <nav class="menu" aria-label="Seções">
      <a href="#/quadro" data-rota="quadro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></svg>Atendimentos</a>
      <a href="#/cadastros" data-rota="cadastros"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V7l8-4 8 4v14"/><path d="M9 21v-6h6v6M9 10h.01M15 10h.01"/></svg>Empresas e funções</a>
      <a href="#/periodicos" data-rota="periodicos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M12 14v3l2 1"/></svg>Periódicos</a>
      <a href="#/automacoes" data-rota="automacoes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></svg>Automações</a>
      <a href="#/suporte" data-rota="suporte"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>Suporte de TI</a>
    </nav>
    <div class="lateral__pe">
      <span class="lateral__usuario" data-usuario></span>
      <button type="button" data-sair>Sair</button>
      <button type="button" data-restaurar>Restaurar a demonstração</button>
    </div>
  </aside>

  <main class="principal" id="vista" tabindex="-1"></main>
</div>

<div class="veu" data-veu hidden></div>
<section class="painel" data-painel aria-label="Candidato" hidden></section>

<dialog class="modal" data-modal-novo>
  <form method="dialog" data-form-novo novalidate>
    <h2>Novo atendimento</h2>
    <p style="color:var(--apoio);font-size:14px;margin-top:-6px">Ao salvar, o sistema gera o link da ficha e prepara a mensagem de WhatsApp.</p>
    <label class="campo">Nome completo<input class="entrada" name="nome" required autocomplete="off" data-campo="nome"></label>
    <div class="acoes-linha">
      <label class="campo">CPF<input class="entrada" name="cpf" inputmode="numeric" placeholder="000.000.000-00" required data-campo="cpf"></label>
      <label class="campo">Celular (WhatsApp)<input class="entrada" name="celular" inputmode="tel" placeholder="(17) 99999-9999" required data-campo="tel"></label>
    </div>
    <div class="acoes-linha">
      <label class="campo">Tipo de exame<select class="entrada" name="tipoExame" data-sel-tipo></select></label>
      <label class="campo" data-so-tipo="admissional">Admissão prevista<input class="entrada" type="date" name="admissaoEm" required data-futuro></label>
      <label class="campo" data-so-tipo="retorno_trabalho">Afastado desde <small>Início do afastamento por doença ou acidente</small><input class="entrada" type="date" name="afastadoDesde" required data-passado></label>
    </div>
    <label class="campo">Empresa<select class="entrada" name="empresaId" required data-sel-empresa></select></label>
    <label class="campo">Função<select class="entrada" name="funcaoId" required data-sel-funcao></select><small data-riscos-funcao></small></label>
    <div class="modal__acoes">
      <button class="botao botao--claro" value="cancelar" formnovalidate>Cancelar</button>
      <button class="botao" value="salvar">Cadastrar e gerar link</button>
    </div>
  </form>
</dialog>

<dialog class="modal modal--aso" data-modal-aso>
  <div data-aso-conteudo></div>
  <div class="modal__corpo" style="padding-top:0">
    <div class="modal__acoes">
      <button class="botao botao--claro" type="button" data-fechar-aso>Fechar</button>
      <button class="botao" type="button" data-imprimir>Imprimir ou salvar em PDF</button>
    </div>
  </div>
</dialog>

<div class="toast" data-toast role="status" aria-live="polite"></div>

<script src="campos.js"></script>
<script src="dados.js"></script>
<script src="contas.js"></script>
<script src="sessao.js"></script>
<script src="movimento.js"></script>
<script src="app.js"></script>
</body>
</html>
