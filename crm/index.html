<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus Safe: modelo do CRM</title>
<meta name="description" content="Modelo funcional do CRM da Nexus Safe: quadro de candidatos, ficha admissional, tela do médico, ASO e automações.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A7A5C">
<link rel="icon" href="../assets/marca.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="crm.css">
</head>
<body>
<div class="demo-faixa">Modelo de demonstração. Dados fictícios, salvos só neste navegador. <a href="../">Voltar ao plano</a></div>

<div class="app">
  <aside class="lateral">
    <a class="marca" href="#/quadro"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#0A7A5C"/><path d="M10.5 22V10l11 12V10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>Nexus Safe</a>
    <div class="lateral__clinica">Agência<b data-clinica></b></div>
    <nav class="menu" aria-label="Seções">
      <a href="#/quadro" data-rota="quadro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></svg>Candidatos</a>
      <a href="#/cadastros" data-rota="cadastros"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V7l8-4 8 4v14"/><path d="M9 21v-6h6v6M9 10h.01M15 10h.01"/></svg>Empresas e funções</a>
      <a href="#/automacoes" data-rota="automacoes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></svg>Automações</a>
    </nav>
    <div class="lateral__pe">
      <button type="button" data-restaurar>Restaurar a demonstração</button>
      <a href="../">Ver o plano</a>
    </div>
  </aside>

  <main class="principal" id="vista" tabindex="-1"></main>
</div>

<div class="veu" data-veu hidden></div>
<section class="painel" data-painel aria-label="Candidato" hidden></section>

<dialog class="modal" data-modal-novo>
  <form method="dialog" data-form-novo>
    <h2>Novo candidato</h2>
    <p style="color:var(--apoio);font-size:14px;margin-top:-6px">Ao salvar, o sistema gera o link da ficha e prepara a mensagem de WhatsApp.</p>
    <label class="campo">Nome completo<input class="entrada" name="nome" required autocomplete="off"></label>
    <div class="acoes-linha">
      <label class="campo">CPF<input class="entrada" name="cpf" inputmode="numeric" placeholder="000.000.000-00" required></label>
      <label class="campo">Celular (WhatsApp)<input class="entrada" name="celular" inputmode="tel" placeholder="(17) 99999-9999" required></label>
    </div>
    <label class="campo">Empresa<select class="entrada" name="empresaId" required data-sel-empresa></select></label>
    <label class="campo">Função<select class="entrada" name="funcaoId" required data-sel-funcao></select><small data-riscos-funcao></small></label>
    <div class="modal__acoes">
      <button class="botao botao--claro" value="cancelar" formnovalidate>Cancelar</button>
      <button class="botao" value="salvar">Cadastrar e gerar link</button>
    </div>
  </form>
</dialog>

<dialog class="modal modal--aso" data-modal-aso>
  <div data-aso-conteudo></div>
  <div class="modal__corpo" style="padding-top:0">
    <div class="modal__acoes">
      <button class="botao botao--claro" type="button" data-fechar-aso>Fechar</button>
      <button class="botao" type="button" data-imprimir>Imprimir ou salvar em PDF</button>
    </div>
  </div>
</dialog>

<div class="toast" data-toast role="status" aria-live="polite"></div>

<script src="dados.js"></script>
<script src="app.js"></script>
</body>
</html>
