<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus Safe: opções de logo</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/marca.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --verde: #0A7A5C; --tinta: #0F1F1B; --apoio: #5A6964; --linha: #DCE3E0; --fundo: #F4F6F5; }
  * { box-sizing: border-box; }
  html { -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--fundo); color: var(--tinta); font: 15px/1.5 Inter, system-ui, sans-serif; }
  header { max-width: 1120px; margin: 0 auto; padding: 40px 16px 8px; }
  h1 { font: 700 32px/1.1 "Inter Tight"; letter-spacing: -.02em; margin: 0 0 8px; }
  header p { color: var(--apoio); margin: 0; max-width: 40em; }
  main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 60px; display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(min(330px, 100%), 1fr)); }
  .op { background: #fff; border-radius: 18px; box-shadow: inset 0 0 0 1px var(--linha); padding: 22px; display: grid; gap: 18px; }
  .op__cab { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .op h2 { margin: 0; font: 600 18px "Inter Tight"; }
  .op__num { font-weight: 700; color: var(--verde); font-size: 14px; }
  .op p { margin: -10px 0 0; color: var(--apoio); font-size: 14px; }
  .palco { display: grid; place-items: center; height: 190px; border-radius: 12px; background: #FAFBFA; }
  .tamanhos { display: flex; align-items: center; gap: 14px; }
  .escuro { background: var(--tinta); border-radius: 14px; padding: 8px; }
  .wm { display: flex; align-items: center; gap: 10px; padding-top: 14px; border-top: 1px solid var(--linha); }
  .wm span { font: 700 21px "Inter Tight"; letter-spacing: -.02em; }
  .wm span i { font-style: normal; }
  svg { display: block; }
</style>
</head>
<body>
<header>
  <h1>Opções de logo</h1>
  <p>A logo em uso é a 1. As outras ficam aqui para comparar, em tamanho grande, no fundo escuro, nos tamanhos de ícone (32 e 18 px) e ao lado do nome.</p>
</header>
<main id="opcoes"></main>
<script>
  var V = '#0A7A5C', T = '#0F1F1B';
  var A = 'M22 64V34a12 12 0 0 1 12-12h30', B = 'M78 36v30a12 12 0 0 1-12 12H36';
  var OPCOES = [
    { nome: 'Elo (em uso)', txt: 'Dois cantos que se encaixam em volta de um centro protegido: a conexão do Nexus e a proteção do Safe. É a logo aplicada no site e no CRM.',
      svg: function (c, bg, c2) { return '<svg viewBox="15 15 70 70"><path d="' + A + '" fill="none" stroke="' + c + '" stroke-width="14" stroke-linecap="round"/><path d="' + B + '" fill="none" stroke="' + (c2 || '#075742') + '" stroke-width="14" stroke-linecap="round"/><rect x="42" y="42" width="16" height="16" rx="4" fill="' + c + '"/></svg>'; } },
    { nome: 'Escudo', txt: 'N vazado num escudo sólido. O mais direto para segurança do trabalho, e por isso o mais comum no setor.',
      svg: function (c, bg) { return '<svg viewBox="0 0 100 100"><path d="M50 10 84 22v26c0 21-14 36-34 44C30 84 16 69 16 48V22z" fill="' + c + '"/><path d="M36 66V34h8l12 18V34h8v32h-8L44 48v18z" fill="' + bg + '"/></svg>'; } },
    { nome: 'Bloco', txt: 'N vazado num quadrado de cantos suaves. Cara de aplicativo, lê bem em qualquer tamanho.',
      svg: function (c, bg) { return '<svg viewBox="0 0 100 100"><rect x="12" y="12" width="76" height="76" rx="20" fill="' + c + '"/><path d="M33 70V30h8.5l18 26V30H67v40h-8.5l-18-26v26z" fill="' + bg + '"/></svg>'; } }
  ];
  function tam(svg, px) { return svg.replace('<svg ', '<svg width="' + px + '" height="' + px + '" '); }
  var h = '';
  OPCOES.forEach(function (o, i) {
    h += '<section class="op"><div class="op__cab"><h2>' + o.nome + '</h2><span class="op__num">' + (i + 1) + '</span></div><p>' + o.txt + '</p>' +
      '<div class="palco">' + tam(o.svg(V, '#FAFBFA'), 160) + '</div>' +
      '<div class="tamanhos"><div class="escuro">' + tam(o.svg('#FFFFFF', T, '#9FD3BF'), 64) + '</div>' + tam(o.svg(V, '#fff'), 32) + tam(o.svg(V, '#fff'), 18) + '</div>' +
      '<div class="wm">' + tam(o.svg(V, '#fff'), 40) + '<span>Nexus <i>Safe</i></span></div></section>';
  });
  document.getElementById('opcoes').innerHTML = h;
</script>
</body>
</html>
